name: Job Agent

on:
  schedule:
    - cron: "0 */2 * * *"  # every 2 hours (UTC); GitHub may start runs a few minutes late
  workflow_dispatch:  # "Run workflow" button in the Actions tab

permissions:
  contents: read

concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Cloud deps only: Playwright lives in requirements-local.txt and is never installed here.
      - run: pip install -r requirements.txt

      # Don't let broken code touch the Sheet, Gmail or Telegram.
      - run: python -m pytest -q

      - run: python main.py
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}

      # Alert emails no parser could read, for debugging (private to the repo, kept 7 days).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failed-emails
          path: failed_emails/
          if-no-files-found: ignore
          retention-days: 7
